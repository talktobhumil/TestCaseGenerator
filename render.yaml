services:
  - type: web
    name: servicenow-qa-testcase-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: HF_MODEL
        value: Qwen/Qwen3-0.6B
      - key: HF_PROVIDER
        value: auto
